[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pmresearch"
version = "0.1.0"
description = "Read-only Polymarket and Kalshi data collection for US election and macro research"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "cryptography>=44", "websockets>=15,<17", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
graphql = ["graphql-core>=3.2,<4"]

[project.scripts]
pmresearch = "pmresearch.cli:main"

[tool.setuptools.packages.find]
include = ["pmresearch*"]

[tool.setuptools.package-data]
pmresearch = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
